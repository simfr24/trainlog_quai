name: quai

services:
  db:
    image: postgis/postgis:17-3.5
    # Sized for building the world; the build session raises its own memory further.
    # shared_buffers holds what searches read (about 4GB for the world), and pg_prewarm
    # reloads it after a restart, as the disk is a hard drive. wal_level=minimal: a table
    # created or rewritten whole is not written to the WAL as well, halving a build's
    # writes; nothing here replicates, and a lost build is rebuilt from OSM. A parallel worker
    # per core (QUAI_CORES, set by the Makefile), and room for the build's connections, which
    # run at once on every core (build.py) besides the API's, and for pg_prewarm's workers.
    command: >-
      postgres -c shared_buffers=${QUAI_SHARED_BUFFERS:-8GB} -c max_wal_size=16GB
      -c max_parallel_workers=${QUAI_CORES:-8} -c max_worker_processes=${QUAI_WORKERS:-16}
      -c max_connections=${QUAI_CONNECTIONS:-100} -c shared_preload_libraries=pg_prewarm
      -c wal_level=minimal -c max_wal_senders=0
    # Parallel queries share memory through /dev/shm, 64MB by default.
    shm_size: 4gb
    environment:
      POSTGRES_USER: quai
      POSTGRES_PASSWORD: quai
      POSTGRES_DB: quai
    volumes:
      - db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      # Over TCP: on first start the init server answers on the socket only, then restarts.
      test: ["CMD", "pg_isready", "-U", "quai", "-h", "127.0.0.1"]
      interval: 5s
      retries: 20
    restart: always

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://quai:quai@db/quai?options=-csearch_path%3Dlive,public
    ports:
      - "127.0.0.1:5020:5000"
    # The reverse proxy serves <name>.srv.trainlog.me from the container named <name>, on
    # port 5000, over this network.
    networks:
      default:
      trainlog:
        aliases: [quai]
    depends_on:
      db:
        condition: service_healthy
    restart: always

  import:
    build: ./import
    profiles: ["import"]
    environment:
      PGHOST: db
      PGUSER: quai
      PGPASSWORD: quai
      PGDATABASE: quai
    volumes:
      - .:/data
    command:
      - sh
      - -c
      - >-
        psql -qc 'DROP SCHEMA IF EXISTS raw CASCADE; CREATE SCHEMA raw'
        && osm2pgsql --output=flex --schema=raw --style=/data/flex.lua --number-processes=$$(nproc) /data/filtered.osm.pbf
        && python3 /data/build.py
    depends_on:
      db:
        condition: service_healthy

volumes:
  db:

networks:
  trainlog:
    name: trainlog_network
    external: true
